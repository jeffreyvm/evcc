name: Release - Create Hassio Addon Changelog

on:
  release:
    types: [edited, released]

permissions:
  contents: read

jobs:
  update-changelog:
    name: Update Hassio Changelog
    if: github.repository == 'evcc-io/evcc' # EMS fork: editing a fork release must not touch the addon
    uses: ./.github/workflows/hassio-changelog.yml
    with:
      addon_path: evcc
      include_unreleased: false
    secrets: inherit
