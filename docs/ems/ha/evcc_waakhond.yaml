# Home Assistant: waakhond voor evcc.
#
# Sinds 21 november 2026 stuurt evcc de Indevolts niet meer (docs/ems/F2.md): ze staan op
# zelfverbruik met hun eigen peak shaving. Valt evcc weg, dan is er aan de batterijen dus niets
# terug te zetten. De waakhond meldt alleen nog dat evcc niet reageert: de Alfen laadt dan na
# hoogstens 1 minuut aan de safe current van 6 A (1,4 kW), zonder begrenzing door het
# capaciteitstarief.
#
# Het script indevolt_zelfverbruik blijft, om de Indevolts met de hand terug op zelfverbruik te
# zetten (47005=1 en 1143=0), bv. als een unit nog in real-time control hangt van een oudere
# evcc-versie. Kijk daarna in de Indevolt-app of de peak shaving nog aan staat.
#
# Vereist:
#   - evcc_capaciteit.yaml (de sensor "Capaciteit hartslag" en "Capaciteit modus")
#   - in /config/secrets.yaml het IP-adres van elke Indevolt, bv.:
#       indevolt_garage_host: 192.168.1.51
#       indevolt_zolder_host: 192.168.1.52
#   - de Indevolts zonder wachtwoord op de lokale API (zoals in de evcc-config)
#
# Installatie als package, naast evcc_capaciteit.yaml: /config/packages/evcc_waakhond.yaml
#
# Testen: stop evcc met "systemctl kill -s KILL evcc" (niet terwijl de auto laadt) en kijk of
# de melding binnen 2 tot 3 minuten verschijnt. Start evcc daarna opnieuw.

mqtt:
  binary_sensor:
    # evcc publiceert "online" bij de start en de broker zet "offline" (last will)
    # zodra de verbinding wegvalt, bv. bij een crash of een herstart van de LXC
    - name: "evcc online"
      unique_id: evcc_online
      default_entity_id: binary_sensor.evcc_online
      state_topic: "evcc/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity

rest_command:
  # config wordt als JSON in de URL meegegeven, zoals de lokale Indevolt-API vraagt
  indevolt_setdata:
    url: >-
      http://{{ host }}:8080/rpc/Indevolt.SetData?config={{ ('{"f":16,"t":' ~ register ~ ',"v":[' ~ value ~ ']}') | urlencode }}
    method: POST
    timeout: 5

script:
  indevolt_zelfverbruik:
    alias: "Indevolts terug naar zelfverbruik"
    description: "Zet beide Indevolts op zelfverbruik (47005=1) en netladen uit (1143=0), zonder evcc."
    mode: single
    variables:
      hosts:
        - !secret indevolt_garage_host
        - !secret indevolt_zolder_host
    sequence:
      # twee rondes: lukt de tweede call van een unit niet, dan blijft netladen anders aan
      - repeat:
          count: 2
          sequence:
            - repeat:
                for_each: "{{ hosts }}"
                sequence:
                  - action: rest_command.indevolt_setdata
                    continue_on_error: true
                    data:
                      host: "{{ repeat.item }}"
                      register: 47005
                      value: 1
                  - action: rest_command.indevolt_setdata
                    continue_on_error: true
                    data:
                      host: "{{ repeat.item }}"
                      register: 1143
                      value: 0
            - delay: "00:00:10"

automation:
  - id: evcc_waakhond
    alias: "evcc waakhond: melding als evcc niet reageert"
    description: "evcc stuurt 120 s geen hartslag of is offline: melding. De batterijen stuurt evcc niet, die blijven zoals ze zijn."
    mode: single
    triggers:
      # de hartslag staat stil: evcc hangt, ook als de MQTT-verbinding nog open is
      - trigger: template
        id: hartslag
        value_template: >-
          {%- set t = states('sensor.capaciteit_hartslag') | as_datetime(none) -%}
          {{ t is not none and (now() - t).total_seconds() > 120 }}
      # evcc is weg van MQTT
      - trigger: state
        id: offline
        entity_id: binary_sensor.evcc_online
        to: "off"
        for: "00:02:00"
    conditions:
      # alleen als evcc de laadpaal echt begrenst
      - condition: template
        value_template: "{{ states('sensor.capaciteit_modus') == 'on' }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: evcc_waakhond
          title: "evcc reageert niet"
          message: >-
            {{ 'evcc stuurt geen hartslag meer' if trigger.id == 'hartslag' else 'evcc is offline op MQTT' }}
            sinds {{ states('sensor.capaciteit_hartslag') | as_datetime(now()) | as_local | as_timestamp | timestamp_custom('%H:%M') }}.
            De laadpaal is niet meer begrensd door het capaciteitstarief (safe current 6 A). Kijk in de evcc-LXC:
            systemctl status evcc en journalctl -u evcc -n 100.
      # voeg hier je gsm toe, bv.:
      # - action: notify.mobile_app_jouw_gsm
      #   data:
      #     title: "evcc reageert niet"
      #     message: "Laadpaal niet begrensd, kijk in de evcc-LXC"
