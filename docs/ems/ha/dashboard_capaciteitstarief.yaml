# Home Assistant-dashboard "Capaciteitstarief" voor de evcc-fork.
# Instellingen > Dashboards > Dashboard toevoegen > Nieuw dashboard vanaf nul,
# daarna: potlood > drie puntjes > Raw-configuratie-editor, alles vervangen door dit bestand.
# Vereist de MQTT-entiteiten uit evcc_capaciteit.yaml.

views:
  - title: Capaciteitstarief
    path: capaciteit
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Dit kwartier
            icon: mdi:timer-outline
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set doel = states('sensor.capaciteit_doel') %}
              {%- set proj = states('sensor.capaciteit_projectie_kwartier') %}
              {%- set gem = states('sensor.capaciteit_gemiddelde_kwartier') %}
              {%- set piek = states('sensor.capaciteit_maandpiek') %}
              {%- set bron = states('sensor.capaciteit_maandpiek_bron') %}
              {%- set eigen = states('sensor.capaciteit_maandpiek_eigen_telling') %}
              {%- set modus = states('sensor.capaciteit_modus') %}
              {%- if proj | is_number and doel | is_number %}
              {%- if proj | float > doel | float %}
              ### ⚠️ Kwartier dreigt boven het doel
              {%- else %}
              ### ✅ Kwartier blijft onder het doel
              {%- endif %}

              Verwacht **{{ proj | float | round(0) | int }} W**, doel **{{ doel | float | round(0) | int }} W**.
              Gemiddelde tot nu {{ gem | float | round(0) | int ~ ' W' if gem | is_number else 'onbekend' }}.
              {%- else %}
              ### ⏳ Nog geen geldig kwartier

              evcc meldt nog geen projectie of doel (projectie: {{ proj }}, doel: {{ doel }}).
              {%- endif %}

              {% if piek | is_number -%}
              {%- set extra = [0, piek | float - 2500] | max / 1000 * 5.04 -%}
              Maandpiek **{{ piek | float | round(0) | int }} W**
              {%- if bron == 'meter' %} volgens de meter{% if eigen | is_number %} (eigen telling {{ eigen | float | round(0) | int }} W){% endif %}
              {%- elif bron == 'evcc' %} volgens de eigen telling van evcc{% endif %}: deze maand
              €{{ ('%.2f' | format(extra)) | replace('.', ',') }} boven de vloer van 2,5 kW.
              {%- else -%}
              Maandpiek nog onbekend ({{ piek }}).
              {%- endif %}

              Modus **{{ modus }}**{% if modus == 'shadow' %}: rekent en meldt, stuurt de laadpaal niet{% elif modus == 'on' %}: begrenst de laadpaal{% elif modus == 'off' %}: regeling staat uit{% elif modus in ['unknown', 'unavailable'] %}: evcc meldt niets{% endif %}.
          - type: gauge
            entity: sensor.capaciteit_projectie_kwartier
            name: Projectie dit kwartier
            min: 0
            max: 8000
            needle: true
            grid_options:
              columns: full
            segments:
              - from: 0
                color: "#43a047"
              - from: 2350
                color: "#ffa600"
              - from: 3300
                color: "#db4437"
          - type: tile
            entity: sensor.capaciteit_doel
            name: Doel
          - type: tile
            entity: sensor.capaciteit_budget_rest_kwartier
            name: Budget rest kwartier
          - type: tile
            entity: sensor.capaciteit_gemiddelde_kwartier
            name: Gemiddelde tot nu
          - type: tile
            entity: binary_sensor.capaciteit_piekdreiging
            name: Piekdreiging

      - type: grid
        cards:
          - type: heading
            heading: Laadpaal
            icon: mdi:ev-station
          - type: tile
            entity: sensor.laadvermogen_auto
            name: Laadvermogen
          - type: tile
            entity: sensor.laadpaal_capaciteit_plafond
            name: Plafond volgens F1
          - type: tile
            entity: binary_sensor.laadpaal_begrensd_door_capaciteitstarief
            name: Begrensd
          - type: tile
            entity: sensor.laadpaal_capaciteit_reden
            name: Reden
          - type: history-graph
            title: Laadvermogen en plafond (12 u)
            hours_to_show: 12
            grid_options:
              columns: full
            entities:
              - entity: sensor.laadvermogen_auto
                name: Laadvermogen
              - entity: sensor.laadpaal_capaciteit_plafond
                name: Plafond F1
          - type: history-graph
            title: Begrenzing (24 u)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.laadpaal_begrensd_door_capaciteitstarief
                name: Begrensd
              - entity: sensor.laadpaal_capaciteit_reden
                name: Reden
              - entity: binary_sensor.capaciteit_piekdreiging
                name: Piekdreiging

      - type: grid
        cards:
          - type: heading
            heading: Verloop
            icon: mdi:chart-line
          - type: tile
            entity: sensor.capaciteit_maandpiek
            name: Maandpiek
          - type: tile
            entity: sensor.capaciteit_maandpiek_tijdstip
            name: Piekkwartier
          - type: tile
            entity: sensor.capaciteit_maandpiek_bron
            name: Bron maandpiek
          - type: tile
            entity: sensor.capaciteit_modus
            name: Modus
          - type: tile
            entity: sensor.thuisbatterij_lading_evcc
            name: Thuisbatterij
          - type: history-graph
            title: Net, projectie en doel (6 u)
            hours_to_show: 6
            grid_options:
              columns: full
            entities:
              - entity: sensor.netvermogen_evcc
                name: Netvermogen
              - entity: sensor.capaciteit_projectie_kwartier
                name: Projectie kwartier
              - entity: sensor.capaciteit_doel
                name: Doel
          - type: statistics-graph
            title: Maandpiek per dag (31 dagen)
            chart_type: line
            period: day
            days_to_show: 31
            stat_types:
              - max
            grid_options:
              columns: full
            entities:
              - entity: sensor.capaciteit_maandpiek
                name: Maandpiek
